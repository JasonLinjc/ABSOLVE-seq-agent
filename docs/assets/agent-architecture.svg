<svg xmlns="http://www.w3.org/2000/svg" width="660" height="545" viewBox="0 0 660 545" role="img" aria-labelledby="title desc">
  <title id="title">ABSOLVE-seq agent architecture</title>
  <desc id="desc">A chat request in Codex or Claude Code selects a repository skill. The skills invoke command-line tools without requiring an MCP server. A matched NoEP and HiFi pair supplies R1 and R2 FASTQs and a sample manifest. The reference index supplies target barcodes, amplicons, guides and plasmid barcode annotations. Conda or a container provides the software, and execution runs locally or on Slurm. Reads are assigned by target barcode, aligned to the target amplicon with CRISPResso2 to identify indels in the cut-site window, and grouped by plasmid barcode. For each target and strategy, the workflow estimates the NoEP and HiFi indel rates, calculates Δindel rate as HiFi minus NoEP in percentage points, and simulates detection power at increases of 0.01 and 0.1 percentage points. The paired_target_rates.tsv table contains indel rates and paired differences. The power_estimates.tsv table contains detection power estimates. The run also produces report.md, a PDF and PNG figure and Excel source data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#211f20"/>
    </marker>
  </defs>
  <style>
    .stage,.box { stroke:#211f20; stroke-width:2; }
    .input { fill:#d9eaf5; }
    .skills { fill:#e8dff3; }
    .data { fill:#d7ebe5; }
    .environment { fill:#e5ead3; }
    .workflow { fill:#f7e6ab; }
    .output { fill:#f4ddcf; }
    .box { fill:white; }
    .flow { fill:none; stroke:#211f20; stroke-width:1.8; marker-end:url(#arrow); }
    text { font:15px Arial,Helvetica,sans-serif; fill:#191819; text-anchor:middle; }
    .label { font-weight:bold; }
    @media (max-width:480px) { text { font-size:17px; } }
  </style>
  <rect width="660" height="545" rx="8" fill="white"/>
  <g aria-label="Input">
    <rect class="stage input" x="8" y="6" width="314" height="71" rx="10"/>
    <text class="label" x="165" y="25">Input</text>
    <rect class="box" x="17" y="32" width="296" height="37" rx="10"/>
    <text x="165" y="56">Chat request in Codex or Claude Code</text>
  </g>
  <path class="flow" d="M165 78 v12"/>
  <g aria-label="Skills and tool access">
    <rect class="stage skills" x="8" y="93" width="314" height="107" rx="10"/>
    <text class="label" x="165" y="114">Skills</text>
    <rect class="box" x="17" y="121" width="296" height="49" rx="10"/>
    <text x="165" y="141">absolve-seq · analysis</text>
    <text x="165" y="161">absolve-seq-figures · plotting</text>
    <text x="165" y="190">CLI access · no MCP server required</text>
  </g>
  <g aria-label="Data">
    <rect class="stage data" x="338" y="6" width="314" height="194" rx="10"/>
    <text class="label" x="495" y="27">Data</text>
    <rect class="box" x="347" y="34" width="296" height="67" rx="10"/>
    <text x="495" y="60">Paired-end FASTQs (R1 and R2)</text>
    <text x="495" y="83">Sample manifest for NoEP and HiFi</text>
    <rect class="box" x="347" y="112" width="296" height="78" rx="10"/>
    <text x="495" y="135">Target barcodes (tBCs)</text>
    <text x="495" y="156">Reference amplicons and guides</text>
    <text x="495" y="177">Plasmid barcode (pBC) annotations</text>
  </g>
  <path class="flow" d="M165 201 v12"/>
  <path class="flow" d="M495 201 v12"/>
  <g aria-label="Environment">
    <rect class="stage environment" x="8" y="217" width="644" height="73" rx="10"/>
    <text class="label" x="330" y="237">Environment</text>
    <rect class="box" x="17" y="244" width="297" height="39" rx="10"/>
    <text x="165.5" y="269">Conda, Docker or Apptainer</text>
    <rect class="box" x="347" y="244" width="296" height="39" rx="10"/>
    <text x="495" y="269">Run locally or submit to Slurm</text>
  </g>
  <path class="flow" d="M330 291 v12"/>
  <g aria-label="Analysis workflow">
    <rect class="stage workflow" x="8" y="307" width="644" height="116" rx="10"/>
    <text class="label" x="330" y="328">Analysis workflow · paired.py</text>
    <rect class="box" x="17" y="335" width="297" height="65" rx="10"/>
    <text x="165.5" y="353">Assign reads to targets by tBC</text>
    <text x="165.5" y="373"><tspan font-weight="bold">CRISPResso2</tspan> · align and call indels</text>
    <text x="165.5" y="393">Group reads by pBC</text>
    <path class="flow" d="M316 365 h27"/>
    <rect class="box" x="347" y="335" width="296" height="65" rx="10"/>
    <text x="495" y="353">Estimate indel rates (%)</text>
    <text x="495" y="373">Δindel rate = HiFi − NoEP (pp)</text>
    <text x="495" y="393">Simulate power (+0.01 and +0.1 pp)</text>
    <text x="330" y="414">79 targets × 4 counting strategies</text>
  </g>
  <path class="flow" d="M330 424 v12"/>
  <g aria-label="Output">
    <rect class="stage output" x="8" y="440" width="644" height="97" rx="10"/>
    <text class="label" x="330" y="459">Output</text>
    <rect class="box" x="17" y="464" width="297" height="46" rx="10"/>
    <text x="165.5" y="482">Indel rate (%) and Δindel rate (pp)</text>
    <text x="165.5" y="503">paired_target_rates.tsv</text>
    <rect class="box" x="347" y="464" width="296" height="46" rx="10"/>
    <text x="495" y="482">Detection power estimates</text>
    <text x="495" y="503">power_estimates.tsv</text>
    <text x="330" y="530">report.md · Dedud figure (PDF and PNG) · Excel source data</text>
  </g>
</svg>
