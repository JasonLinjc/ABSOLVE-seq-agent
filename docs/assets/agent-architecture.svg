<svg xmlns="http://www.w3.org/2000/svg" width="660" height="545" viewBox="0 0 660 545" role="img" aria-labelledby="title desc">
  <title id="title">ABSOLVE-seq agent architecture</title>
  <desc id="desc">A chat request in Codex or Claude Code selects a repository skill. The skills invoke command-line tools without requiring an MCP server. The workflow uses sequencing data and study references. Conda or a container provides the software, and execution runs locally or on Slurm. It verifies editing effects and simulated power, then delivers a report, tables, figures and Excel source data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#211f20"/>
    </marker>
  </defs>
  <style>
    .stage,.box { stroke:#211f20; stroke-width:2; }
    .stage { fill:#fae888; }
    .box { fill:white; }
    .flow { fill:none; stroke:#211f20; stroke-width:1.8; marker-end:url(#arrow); }
    text { font:15px Arial,Helvetica,sans-serif; fill:#191819; text-anchor:middle; }
    .label { font-weight:bold; }
    @media (max-width:480px) { text { font-size:17px; } }
  </style>
  <rect width="660" height="545" rx="8" fill="white"/>
  <g aria-label="Input">
    <rect class="stage" x="8" y="6" width="314" height="71" rx="10"/>
    <text class="label" x="165" y="25">Input</text>
    <rect class="box" x="17" y="32" width="296" height="37" rx="10"/>
    <text x="165" y="56">Chat request in Codex or Claude Code</text>
  </g>
  <path class="flow" d="M165 78 v12"/>
  <g aria-label="Skills and tool access">
    <rect class="stage" x="8" y="93" width="314" height="107" rx="10"/>
    <text class="label" x="165" y="114">Skills</text>
    <rect class="box" x="17" y="121" width="296" height="49" rx="10"/>
    <text x="165" y="141">absolve-seq · analysis</text>
    <text x="165" y="161">absolve-seq-figures · plotting</text>
    <text x="165" y="190">CLI access · no MCP server required</text>
  </g>
  <g aria-label="Data">
    <rect class="stage" x="338" y="6" width="314" height="194" rx="10"/>
    <text class="label" x="495" y="27">Data</text>
    <rect class="box" x="347" y="34" width="296" height="67" rx="10"/>
    <text x="495" y="60">FASTQs and sample manifest</text>
    <text x="495" y="83">or saved counts for a panel refit</text>
    <rect class="box" x="347" y="112" width="296" height="78" rx="10"/>
    <text x="495" y="135">Target and barcode references</text>
    <text x="495" y="156">Supplementary Tables 2–5</text>
    <text x="495" y="177">for manuscript comparisons</text>
  </g>
  <path class="flow" d="M165 201 v12"/>
  <path class="flow" d="M495 201 v12"/>
  <g aria-label="Environment">
    <rect class="stage" x="8" y="217" width="644" height="73" rx="10"/>
    <text class="label" x="330" y="237">Environment</text>
    <rect class="box" x="17" y="244" width="297" height="39" rx="10"/>
    <text x="165.5" y="269">Conda, Docker or Apptainer</text>
    <rect class="box" x="347" y="244" width="296" height="39" rx="10"/>
    <text x="495" y="269">Run locally or submit to Slurm</text>
  </g>
  <path class="flow" d="M330 291 v12"/>
  <g aria-label="Workflow">
    <rect class="stage" x="8" y="307" width="644" height="116" rx="10"/>
    <text class="label" x="330" y="328">Workflow · paired.py</text>
    <rect class="box" x="17" y="338" width="297" height="55" rx="10"/>
    <text x="165.5" y="361">tBC assigns reads to targets</text>
    <text x="165.5" y="382">pBC groups reads into families</text>
    <path class="flow" d="M316 365 h27"/>
    <rect class="box" x="347" y="338" width="296" height="55" rx="10"/>
    <text x="495" y="361">Estimate editing effects</text>
    <text x="495" y="382">and simulate detection power</text>
    <text x="330" y="414">A saved-count refit starts at effect estimation</text>
  </g>
  <path class="flow" d="M330 424 v12"/>
  <g aria-label="Output">
    <rect class="stage" x="8" y="440" width="644" height="97" rx="10"/>
    <text class="label" x="330" y="462">Output</text>
    <rect class="box" x="17" y="471" width="297" height="56" rx="10"/>
    <text x="165.5" y="495">report.md</text>
    <text x="165.5" y="516">Effect and power tables (TSV)</text>
    <rect class="box" x="347" y="471" width="296" height="56" rx="10"/>
    <text x="495" y="495">Paired figure or panel Figure 3b</text>
    <text x="495" y="516">PDF, PNG and Excel source data</text>
  </g>
</svg>
