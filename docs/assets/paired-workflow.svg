<svg xmlns="http://www.w3.org/2000/svg" width="660" height="615" viewBox="0 0 660 615" role="img" aria-labelledby="title desc">
  <title id="title">From FASTQs to paired or manuscript results</title>
  <desc id="desc">Choose a matched pair or the full study. Both routes use the target and plasmid barcodes and count indels under four strategies. The pair produces 316 differences. The panel fits 632 contrasts. The agent checks coverage and returns the report and tables. Each run simulates conditional power from its counts and exports a figure and Excel source data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#211f20"/>
    </marker>
  </defs>
  <style>
    .stage, .output { fill: #fae888; stroke: #211f20; stroke-width: 2; }
    .task { fill: white; stroke: #211f20; stroke-width: 2; }
    .flow { fill: none; stroke: #211f20; stroke-width: 1.8; marker-end: url(#arrow); }
    text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #191819; text-anchor: middle; }
    @media (max-width: 480px) { text { font-size: 19px; } }
  </style>

  <rect width="660" height="615" rx="8" fill="white"/>
  <g aria-label="Choose a comparison in chat">
    <rect class="stage" x="8" y="6" width="644" height="79" rx="10"/>
    <rect class="task" x="20" y="11" width="292" height="47" rx="13"/>
    <text x="166" y="30">One donor and replicate</text>
    <text x="166" y="50">Matched NoEP and HiFi</text>
    <rect class="task" x="344" y="11" width="292" height="47" rx="13"/>
    <text x="490" y="30">Full manuscript panel</text>
    <text x="490" y="50">26 libraries and Tables 2–5</text>
    <text x="330" y="78">Choose a comparison in chat</text>
  </g>
  <path class="flow" d="M166 86 v12"/>
  <path class="flow" d="M490 86 v12"/>
  <g aria-label="Check FASTQs, manifest and references, then run locally or on Slurm">
    <rect class="stage" x="8" y="101" width="644" height="79" rx="10"/>
    <rect class="task" x="20" y="106" width="292" height="47" rx="13"/>
    <text x="166" y="125">Pair default: fast mode</text>
    <text x="166" y="145">Single-end alignment input</text>
    <rect class="task" x="344" y="106" width="292" height="47" rx="13"/>
    <text x="490" y="125">Panel default: manuscript mode</text>
    <text x="490" y="145">Trim paired reads per library</text>
    <text x="330" y="173">Check FASTQs, manifest and references, then run locally or on Slurm</text>
  </g>
  <path class="flow" d="M330 181 v12"/>
  <g aria-label="Analyze 79 targets with the selected Maxi barcode rule">
    <rect class="stage" x="8" y="196" width="644" height="79" rx="10"/>
    <rect class="task" x="20" y="201" width="188" height="47" rx="13"/>
    <text x="114" y="220">Assign targets and</text>
    <text x="114" y="240">extract barcodes</text>
    <path class="flow" d="M209 224 h24"/>
    <rect class="task" x="236" y="201" width="188" height="47" rx="13"/>
    <text x="330" y="220">Align reads with</text>
    <text x="330" y="240">CRISPResso2</text>
    <path class="flow" d="M425 224 h24"/>
    <rect class="task" x="452" y="201" width="188" height="47" rx="13"/>
    <text x="546" y="220">Count indels under</text>
    <text x="546" y="240">four strategies</text>
    <text x="330" y="268">Analyze 79 targets with the selected Maxi barcode rule</text>
  </g>
  <path class="flow" d="M166 276 v12"/>
  <path class="flow" d="M490 276 v12"/>
  <g aria-label="Estimate indel rates and differences">
    <rect class="stage" x="8" y="291" width="644" height="79" rx="10"/>
    <rect class="task" x="20" y="296" width="292" height="47" rx="13"/>
    <text x="166" y="315">Observed indel fractions</text>
    <text x="166" y="335">HiFi rate minus NoEP rate</text>
    <rect class="task" x="344" y="296" width="292" height="47" rx="13"/>
    <text x="490" y="315">Donor-adjusted Firth model</text>
    <text x="490" y="335">One-sided Wald tests, BH q</text>
    <text x="330" y="363">Estimate indel rates and differences</text>
  </g>
  <path class="flow" d="M166 371 v12"/>
  <path class="flow" d="M490 371 v12"/>
  <g aria-label="Simulate power at 0.01 and 0.1 percentage points">
    <rect class="stage" x="8" y="386" width="644" height="79" rx="10"/>
    <rect class="task" x="20" y="391" width="292" height="47" rx="13"/>
    <text x="166" y="410">Two-group binomial simulation</text>
    <text x="166" y="430">Use observed pair depths</text>
    <rect class="task" x="344" y="391" width="292" height="47" rx="13"/>
    <text x="490" y="410">Three-donor simulation</text>
    <text x="490" y="430">Refit donor-adjusted models</text>
    <text x="330" y="458">Simulate power at 0.01 and 0.1 percentage points</text>
  </g>
  <path class="flow" d="M330 466 v12"/>
  <rect class="output" x="126" y="481" width="408" height="33" rx="13"/>
    <text x="330" y="503">Verify tables and return report.md</text>
  <path class="flow" d="M330 515 v12"/>
  <g aria-label="Return the Dedud figure, PDF and Excel source data">
    <rect class="stage" x="8" y="530" width="644" height="79" rx="10"/>
    <rect class="task" x="20" y="535" width="292" height="47" rx="13"/>
    <text x="166" y="554">Matched pair</text>
    <text x="166" y="574">HiFi–NoEP effects and power</text>

    <rect class="task" x="344" y="535" width="292" height="47" rx="13"/>
    <text x="490" y="554">Full manuscript panel</text>
    <text x="490" y="574">Figure 3b with simulated power</text>
    <text x="330" y="602">Return the Dedud figure, PDF and Excel source data</text>
  </g>
</svg>
