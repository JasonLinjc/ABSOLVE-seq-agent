<svg xmlns="http://www.w3.org/2000/svg" width="660" height="562" viewBox="0 0 660 562" role="img" aria-labelledby="title desc">
  <title id="title">From paired FASTQs to an ABSOLVE-seq report</title>
  <desc id="desc">Four stages show the inputs, sample and read preparation, indel analysis and verification. The matched HiFi and NoEP comparison ends with a report and target-level rates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#211f20"/>
    </marker>
  </defs>
  <style>
    .stage, .output { fill: #fae888; stroke: #211f20; stroke-width: 2; }
    .task { fill: white; stroke: #211f20; stroke-width: 2; }
    .flow { fill: none; stroke: #211f20; stroke-width: 1.8; marker-end: url(#arrow); }
    text { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #191819; text-anchor: middle; }
  </style>
  <rect width="660" height="562" rx="8" fill="white"/>
  <g aria-label="Inputs">
    <rect class="stage" x="8" y="8" width="644" height="103" rx="10"/>
    <rect class="task" x="20" y="17" width="188" height="64" rx="13"/>
    <text x="114" y="44">Paired-end</text>
    <text x="114" y="66">FASTQs</text>
    <rect class="task" x="236" y="17" width="188" height="64" rx="13"/>
    <text x="330" y="44">Sample</text>
    <text x="330" y="66">sheet</text>
    <rect class="task" x="452" y="17" width="188" height="64" rx="13"/>
    <text x="546" y="44">Target and barcode</text>
    <text x="546" y="66">references</text>
    <text x="330" y="103">Inputs</text>
  </g>
  <path class="flow" d="M330 112 v16"/>
  <g aria-label="Sample and read preparation">
    <rect class="stage" x="8" y="131" width="644" height="103" rx="10"/>
    <rect class="task" x="20" y="140" width="188" height="64" rx="13"/>
    <text x="114" y="167">Match samples by</text>
    <text x="114" y="189">donor and replicate</text>
    <path class="flow" d="M209 172 h24"/>
    <rect class="task" x="236" y="140" width="188" height="64" rx="13"/>
    <text x="330" y="167">Check read pairs</text>
    <text x="330" y="189">and references</text>
    <path class="flow" d="M425 172 h24"/>
    <rect class="task" x="452" y="140" width="188" height="64" rx="13"/>
    <text x="546" y="167">Prepare reads</text>
    <text x="546" y="189">for alignment</text>
    <text x="330" y="226">Sample and read preparation</text>
  </g>
  <path class="flow" d="M330 235 v16"/>
  <g aria-label="Barcode and indel analysis">
    <rect class="stage" x="8" y="254" width="644" height="103" rx="10"/>
    <rect class="task" x="20" y="263" width="188" height="64" rx="13"/>
    <text x="114" y="290">Align reads with</text>
    <text x="114" y="312">CRISPResso2</text>
    <path class="flow" d="M209 295 h24"/>
    <rect class="task" x="236" y="263" width="188" height="64" rx="13"/>
    <text x="330" y="290">Count indels under</text>
    <text x="330" y="312">four strategies</text>
    <path class="flow" d="M425 295 h24"/>
    <rect class="task" x="452" y="263" width="188" height="64" rx="13"/>
    <text x="546" y="290">Calculate rates for</text>
    <text x="546" y="312">HiFi and NoEP</text>
    <text x="330" y="349">Barcode and indel analysis</text>
  </g>
  <path class="flow" d="M330 358 v16"/>
  <g aria-label="Comparison and verification">
    <rect class="stage" x="8" y="377" width="644" height="103" rx="10"/>
    <rect class="task" x="20" y="386" width="188" height="64" rx="13"/>
    <text x="114" y="413">Subtract NoEP rates</text>
    <text x="114" y="435">from HiFi rates</text>
    <path class="flow" d="M209 418 h24"/>
    <rect class="task" x="236" y="386" width="188" height="64" rx="13"/>
    <text x="330" y="413">Check target and</text>
    <text x="330" y="435">strategy coverage</text>
    <path class="flow" d="M425 418 h24"/>
    <rect class="task" x="452" y="386" width="188" height="64" rx="13"/>
    <text x="546" y="413">Verify checksums</text>
    <text x="546" y="435">for benchmark runs</text>
    <text x="330" y="472">Comparison and verification</text>
  </g>
  <path class="flow" d="M330 481 v16"/>
  <rect class="output" x="191" y="500" width="278" height="54" rx="13"/>
    <text x="330" y="523">Analysis report and</text>
    <text x="330" y="545">target-level results</text>
</svg>
