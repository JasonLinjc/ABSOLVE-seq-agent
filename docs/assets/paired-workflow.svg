<svg xmlns="http://www.w3.org/2000/svg" width="660" height="795" viewBox="0 0 660 795" role="img" aria-labelledby="title desc">
  <title id="title">From FASTQs to paired or manuscript results</title>
  <desc id="desc">Choose a matched pair or the full study. Both routes use the target and plasmid barcodes and count indels under four strategies. The pair produces 316 differences. The panel fits 632 contrasts. The agent checks coverage and returns the report and tables. Optional Figure 3b combines Dedud estimates with the submitted simulation power for each editor and target.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#211f20"/>
    </marker>
  </defs>
  <style>
    .stage, .output { fill: #fae888; stroke: #211f20; stroke-width: 2; }
    .task { fill: white; stroke: #211f20; stroke-width: 2; }
    .flow { fill: none; stroke: #211f20; stroke-width: 1.8; marker-end: url(#arrow); }
    text { font-family: Arial, Helvetica, sans-serif; font-size: 19px; fill: #191819; text-anchor: middle; }
  </style>

  <rect width="660" height="795" rx="8" fill="white"/>
  <g aria-label="Choose a comparison in chat">
    <rect class="stage" x="8" y="8" width="644" height="98" rx="10"/>
    <rect class="task" x="20" y="16" width="292" height="60" rx="13"/>
    <text x="166" y="41">One donor and replicate</text>
    <text x="166" y="63">Matched NoEP and HiFi</text>
    <rect class="task" x="344" y="16" width="292" height="60" rx="13"/>
    <text x="490" y="41">Full manuscript panel</text>
    <text x="490" y="63">26 libraries and Tables 2–5</text>
    <text x="330" y="99">Choose a comparison in chat</text>
  </g>
  <path class="flow" d="M166 107 v18"/>
  <path class="flow" d="M490 107 v18"/>
  <g aria-label="Check FASTQs, manifest and references, then run locally or on Slurm">
    <rect class="stage" x="8" y="130" width="644" height="98" rx="10"/>
    <rect class="task" x="20" y="138" width="292" height="60" rx="13"/>
    <text x="166" y="163">Pair default: fast mode</text>
    <text x="166" y="185">Single-end alignment input</text>
    <rect class="task" x="344" y="138" width="292" height="60" rx="13"/>
    <text x="490" y="163">Panel default: manuscript mode</text>
    <text x="490" y="185">Trim paired reads per library</text>
    <text x="330" y="221">Check FASTQs, manifest and references, then run locally or on Slurm</text>
  </g>
  <path class="flow" d="M330 229 v18"/>
  <g aria-label="Analyze 79 targets with the selected Maxi barcode rule">
    <rect class="stage" x="8" y="252" width="644" height="98" rx="10"/>
    <rect class="task" x="20" y="260" width="188" height="60" rx="13"/>
    <text x="114" y="285">Assign targets and</text>
    <text x="114" y="307">extract barcodes</text>
    <path class="flow" d="M209 290 h24"/>
    <rect class="task" x="236" y="260" width="188" height="60" rx="13"/>
    <text x="330" y="285">Align reads with</text>
    <text x="330" y="307">CRISPResso2</text>
    <path class="flow" d="M425 290 h24"/>
    <rect class="task" x="452" y="260" width="188" height="60" rx="13"/>
    <text x="546" y="285">Count indels under</text>
    <text x="546" y="307">four strategies</text>
    <text x="330" y="343">Analyze 79 targets with the selected Maxi barcode rule</text>
  </g>
  <path class="flow" d="M166 351 v18"/>
  <path class="flow" d="M490 351 v18"/>
  <g aria-label="Estimate indel rates and differences">
    <rect class="stage" x="8" y="374" width="644" height="98" rx="10"/>
    <rect class="task" x="20" y="382" width="292" height="60" rx="13"/>
    <text x="166" y="407">Observed indel fractions</text>
    <text x="166" y="429">HiFi rate minus NoEP rate</text>
    <rect class="task" x="344" y="382" width="292" height="60" rx="13"/>
    <text x="490" y="407">Donor-adjusted Firth model</text>
    <text x="490" y="429">One-sided Wald tests, BH q</text>
    <text x="330" y="465">Estimate indel rates and differences</text>
  </g>
  <path class="flow" d="M166 473 v18"/>
  <path class="flow" d="M490 473 v18"/>
  <g aria-label="Verify coverage and write the report">
    <rect class="stage" x="8" y="496" width="644" height="98" rx="10"/>
    <rect class="task" x="20" y="504" width="292" height="60" rx="13"/>
    <text x="166" y="529">316 target / strategy rows</text>
    <text x="166" y="551">Check counts and rates</text>
    <rect class="task" x="344" y="504" width="292" height="60" rx="13"/>
    <text x="490" y="529">632 panel comparisons</text>
    <text x="490" y="551">Check calls against supplements</text>
    <text x="330" y="587">Verify coverage and write the report</text>
  </g>
  <path class="flow" d="M330 595 v18"/>
  <rect class="output" x="126" y="619" width="408" height="48" rx="13"/>
    <text x="330" y="649">Return report.md and supporting tables</text>
  <g aria-label="Optional Figure 3b and Excel source data">
    <rect class="stage" x="8" y="685" width="644" height="101" rx="10"/>
    <rect class="task" x="20" y="694" width="292" height="60" rx="13"/>
    <text x="166" y="720">Dedud effect estimates</text>
    <text x="166" y="742">Submitted workbook or panel fit</text>
    <path d="M322 724 h12 M328 718 v12" fill="none" stroke="#211f20" stroke-width="2"/>
    <rect class="task" x="344" y="694" width="292" height="60" rx="13"/>
    <text x="490" y="720">Published simulation power</text>
    <text x="490" y="742">Supplementary Table 2</text>
    <text x="330" y="776">Optional Figure 3b and Excel source data</text>
  </g>
</svg>
