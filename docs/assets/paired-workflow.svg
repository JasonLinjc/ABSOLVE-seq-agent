<svg xmlns="http://www.w3.org/2000/svg" width="660" height="336" viewBox="0 0 660 336" role="img" aria-labelledby="title desc">
  <title id="title">Matched-pair FASTQ-to-report workflow</title>
  <desc id="desc">Match the NoEP and HiFi FASTQs for one donor and replicate. Verify inputs and prepare reads. Assign targets by target barcode, align with CRISPResso2 and group reads by plasmid barcode. Count indels using four strategies. Estimate the NoEP and HiFi indel rates for each target and strategy, subtract the NoEP rate from the HiFi rate in percentage points, simulate detection power, export the Dedud figure and Excel source data, verify the outputs and write the report.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#211f20"/>
    </marker>
  </defs>
  <style>
    .stage, .task, .output { stroke: #211f20; stroke-width: 2; }
    .input { fill: #d9eaf5; }
    .reads { fill: #f7e6ab; }
    .estimates { fill: #e8dff3; }
    .output { fill: #f4ddcf; }
    .task { fill: white; }
    .flow { fill: none; stroke: #211f20; stroke-width: 1.8; marker-end: url(#arrow); }
    text { font: 15px Arial, Helvetica, sans-serif; fill: #191819; text-anchor: middle; }
    .label { font-weight: bold; }
    @media (max-width: 480px) { text { font-size: 19px; } }
  </style>
  <rect width="660" height="336" rx="8" fill="white"/>
  <g aria-label="Inputs and preparation">
    <rect class="stage input" x="8" y="5" width="644" height="52" rx="10"/>
    <text class="label" x="330" y="26">Match NoEP and HiFi FASTQs by donor and replicate</text>
    <text x="330" y="47">Check the manifest, FASTQ checksums and references. Prepare reads.</text>
  </g>
  <path class="flow" d="M330 58 v12"/>
  <g aria-label="Read processing">
    <rect class="stage reads" x="8" y="73" width="644" height="74" rx="10"/>
    <rect class="task" x="19" y="79" width="201" height="43" rx="9"/>
    <text x="119.5" y="97">Target barcode (tBC)</text>
    <text x="119.5" y="116">Assign reads by tBC</text>
    <path class="flow" d="M222 100 h18"/>
    <rect class="task" x="244" y="79" width="151" height="43" rx="9"/>
    <text x="319.5" y="97">Align reads with</text>
    <text x="319.5" y="116">CRISPResso2</text>
    <path class="flow" d="M397 100 h18"/>
    <rect class="task" x="419" y="79" width="222" height="43" rx="9"/>
    <text x="530" y="97">Plasmid barcode (pBC)</text>
    <text x="530" y="116">Group reads by pBC</text>
    <text x="330" y="140">Count indels with Unfiltered, Dedup, Dedud and Dedud+Dedup</text>
  </g>
  <path class="flow" d="M330 148 v12"/>
  <g aria-label="Indel rate estimation, paired difference and detection power">
    <rect class="stage estimates" x="8" y="163" width="644" height="78" rx="10"/>
    <rect class="task" x="19" y="169" width="192" height="44" rx="9"/>
    <text class="label" x="115" y="187">Estimate indel rates</text>
    <text x="115" y="206">NoEP and HiFi (%)</text>
    <path class="flow" d="M213 191 h16"/>
    <rect class="task" x="233" y="169" width="190" height="44" rx="9"/>
    <text x="328" y="187">Calculate Δindel rate</text>
    <text x="328" y="206">HiFi − NoEP (pp)</text>
    <path class="flow" d="M425 191 h16"/>
    <rect class="task" x="445" y="169" width="196" height="44" rx="9"/>
    <text x="543" y="187">Simulate power</text>
    <text x="543" y="206">+0.01 and +0.1 pp</text>
    <text x="330" y="234">79 targets × 4 strategies = 316 paired effects and 632 power estimates</text>
  </g>
  <path class="flow" d="M330 242 v12"/>
  <g aria-label="Figure and report">
    <rect class="output" x="8" y="257" width="644" height="73" rx="10"/>
    <text x="330" y="278">Export the Dedud figure (PDF and PNG) and Excel source data</text>
    <text x="330" y="299">Verify outputs and write the report</text>
    <text class="label" x="330" y="321">Open results/report.md</text>
  </g>
</svg>
