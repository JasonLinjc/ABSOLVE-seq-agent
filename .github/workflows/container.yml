name: Build analysis container

on:
  push:
    tags: ['container-v*']
  workflow_dispatch:
    inputs:
      verify_public_pair:
        description: Run the public D3734/T1 raw FASTQs through the built Docker image
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the locked Linux x86-64 image
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "absolve-seq-agent:$GITHUB_SHA" .
          docker run --rm "absolve-seq-agent:$GITHUB_SHA" CRISPResso --version
          docker run --rm "absolve-seq-agent:$GITHUB_SHA" Rscript -e 'stopifnot(requireNamespace("brglm2", quietly=TRUE))'
          docker run --rm -e ABSOLVE_MANIFEST=/opt/absolve/examples/manifest.example.tsv \
            "absolve-seq-agent:$GITHUB_SHA" python /opt/absolve/paired.py --list
          docker run --rm "absolve-seq-agent:$GITHUB_SHA" python -m absolve.power_analysis --help
          docker run --rm "absolve-seq-agent:$GITHUB_SHA" python -m tools.validate_family_panel --help
      - name: Export the Docker image and convert it to SIF
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get -qq update
          sudo apt-get -qq install -y apptainer
          mkdir -p dist
          docker save "absolve-seq-agent:$GITHUB_SHA" -o "$RUNNER_TEMP/absolve.tar"
          apptainer build dist/absolve-linux-amd64.sif "docker-archive:$RUNNER_TEMP/absolve.tar"
          apptainer exec --cleanenv dist/absolve-linux-amd64.sif CRISPResso --version
          gzip -1c "$RUNNER_TEMP/absolve.tar" > dist/absolve-linux-amd64.tar.gz
          (cd dist && sha256sum absolve-linux-amd64.* > SHA256SUMS)
      - name: Publish versioned container assets
        if: startsWith(github.ref, 'refs/tags/container-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ABSOLVE-seq analysis container ${GITHUB_REF_NAME#container-}" \
            --notes 'Linux x86-64 Docker archive and Apptainer SIF built from the same locked environment. Verify each download using SHA256SUMS.' \
            dist/absolve-linux-amd64.tar.gz dist/absolve-linux-amd64.sif dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: analysis-container
          path: dist/
          compression-level: 0
          retention-days: 3

  verify-public-pair:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_public_pair
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: analysis-container
          path: ${{ runner.temp }}/image
      - name: Load and verify the image built from this commit
        working-directory: ${{ runner.temp }}/image
        run: |
          sha256sum -c SHA256SUMS
          docker load -i absolve-linux-amd64.tar.gz
          image="absolve-seq-agent:$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$GITHUB_SHA"
          docker image inspect --format '{{.Id}}' "$image" > "$RUNNER_TEMP/image-id.txt"
      - name: Download the published references and both mates of each library
        run: |
          data="$RUNNER_TEMP/pair-data"
          mkdir -p "$data/fastqs" "$data/upstream/test/data/target_info"
          upstream=https://raw.githubusercontent.com/pellinlab/ABSOLVE-seq/271355dfe40cf46b952e82b88dd4521f23f9feb4/test/data
          for file in plasmid_barcode_category.tsv.gz adapters.fa target_info/NovaSeq3_sample_info.csv target_info/OT_guide_amplicon_seq.csv target_info/target_oligos_sequenes.csv; do
            curl -fLsS --retry 4 --retry-all-errors "$upstream/$file" -o "$data/upstream/test/data/$file"
          done
          awk -F '\t' 'NR > 1 { print $4; print $6 }' examples/d3734_t1_ena.tsv |
            (cd "$data/fastqs" && xargs -P 4 -n 1 curl -fLsS --retry 4 --retry-all-errors -C - -O)
      - name: Run the packaged agent from raw FASTQs and verify the report
        run: |
          mkdir -p "$RUNNER_TEMP/pair-output"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/pair-data:/data" -v "$RUNNER_TEMP/pair-output:/output" \
            -e ABSOLVE_DATA=/data -e MPLCONFIGDIR=/tmp/matplotlib -e HOME=/tmp \
            "absolve-seq-agent:$GITHUB_SHA" bash -eu -o pipefail -c '
              python setup_references.py
              python examples/d3734_t1_manifest.py --ena /data/fastqs /data/sample_manifest.tsv
              python paired.py --executor local --threads 4 --donor D3734 --replicate T1 --fresh --output /output/pair
              python verify_results.py pair-manuscript /output/pair/results
              python verify_results.py power /output/pair/results
              cd /output/pair/results
              echo "3cb3b127f0f1be573635beff772ec00e37a19361c3707fb8a341c218e9cb44e3  power_estimates.tsv" | sha256sum -c -
              echo "a206a3847e5ab58465a7924f4a36919d48fcb954d0ac06213560df63cdb26c5a  figures/plotted_data.tsv" | sha256sum -c -
              sha256sum *.tsv *.json report.md figures/* > SHA256SUMS
            '
          cp "$RUNNER_TEMP/image-id.txt" "$RUNNER_TEMP/pair-output/pair/"
      - uses: actions/upload-artifact@v4
        with:
          name: D3734-T1-docker-report
          path: |
            ${{ runner.temp }}/pair-output/pair/results
            ${{ runner.temp }}/pair-output/pair/run.json
            ${{ runner.temp }}/pair-output/pair/image-id.txt
          if-no-files-found: error
          retention-days: 14
